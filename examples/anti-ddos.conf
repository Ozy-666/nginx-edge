# ─────────────────────────────────────────────────────────────────────────────
# examples/anti-ddos.conf — rate limiting, connection limiting and timeout
# hardening for nginx.
#
# THE NUMBERS BELOW ARE PLACEHOLDERS AND ARE DELIBERATELY NOT OUR OPERATING
# VALUES. Copying them verbatim will either throttle your real users or fail to
# stop anything. The section "Deriving your own numbers" at the bottom shows how
# to compute them from your own access log. Do that first.
#
# Scope: this handles application-layer (L7) floods and slow-connection attacks.
# A volumetric L3/L4 flood saturates your uplink before nginx is consulted at
# all — that needs filtering upstream (XDP/nftables, or your provider).
# ─────────────────────────────────────────────────────────────────────────────


# ═════════════════════════════════════════════════════════════════════════════
# http{} context — zones must be declared here, not inside server{}
# ═════════════════════════════════════════════════════════════════════════════

# ── Client identity ──────────────────────────────────────────────────────────
# $binary_remote_addr is used instead of $remote_addr because it costs 4 bytes
# (IPv4) / 16 bytes (IPv6) per entry rather than up to 45, so a given zone size
# holds far more state. 10m holds roughly 160k IPv4 entries.
#
# BEHIND A CDN OR PROXY: $binary_remote_addr is the *proxy's* address, so every
# visitor shares one bucket and the limit is meaningless. Configure
# `set_real_ip_from` + `real_ip_header` for your provider's ranges first, and
# only trust those ranges — a spoofable X-Forwarded-For turns a rate limiter
# into a trivially bypassed decoration.
#
# set_real_ip_from 10.0.0.0/8;      # your CDN's published ranges ONLY
# real_ip_header   X-Forwarded-For;
# real_ip_recursive on;

# ── Rate limit zones ─────────────────────────────────────────────────────────
# Separate zones per traffic class. One global limit cannot be both generous
# enough for page loads and tight enough for login attempts.
limit_req_zone $binary_remote_addr zone=req_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=req_api:10m     rate=30r/s;
limit_req_zone $binary_remote_addr zone=req_auth:10m    rate=15r/m;   # per MINUTE

# ── Connection limit zone ────────────────────────────────────────────────────
# Caps concurrent connections, which rate limiting does not: a client can sit
# well under 10r/s while holding hundreds of open sockets.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ── Status codes ─────────────────────────────────────────────────────────────
# 429 is the correct signal — it tells well-behaved clients and crawlers to back
# off. The default 503 reads as "server broken" and can hurt you in search.
limit_req_status  429;
limit_conn_status 429;

# Log rejections at `warn` so they are visible without drowning the error log.
limit_req_log_level warn;

# ── Timeouts: the slowloris defence ──────────────────────────────────────────
# Slow attacks work by opening many connections and sending bytes just fast
# enough to stay alive. Short timeouts are the counter, and they cost nothing
# against legitimate traffic.
client_header_timeout 10s;   # time to send the complete request header
client_body_timeout   10s;   # time between body reads
send_timeout          10s;   # time between successful writes to the client
keepalive_timeout     30s;   # idle keepalive; lower = fewer parked sockets
keepalive_requests    500;

# Free the socket immediately on timeout instead of doing a graceful close.
reset_timedout_connection on;

# ── Request size caps ────────────────────────────────────────────────────────
# Bound what a single request can make nginx allocate. Raise client_max_body_size
# only on the specific location that accepts uploads, never globally.
client_max_body_size       1m;
client_body_buffer_size    16k;
client_header_buffer_size  1k;
large_client_header_buffers 4 8k;

# ── HTTP/2 and HTTP/3 stream limits ──────────────────────────────────────────
# One connection can carry many concurrent streams, so per-connection limits
# matter independently of per-IP limits.
http2_max_concurrent_streams 128;
# http3_max_concurrent_streams 128;


# ═════════════════════════════════════════════════════════════════════════════
# server{} context
# ═════════════════════════════════════════════════════════════════════════════

server {
    listen 443 ssl;
    server_name example.com;

    # ── Baseline limits for the whole vhost ──────────────────────────────────
    # `burst` absorbs the normal clustering of real traffic (a page load fires
    # many requests at once). `nodelay` serves the burst immediately rather than
    # queueing it — without it, legitimate page loads feel slow under load.
    limit_req  zone=req_general burst=20 nodelay;
    limit_conn conn_per_ip 20;

    # Cap per-client bandwidth so one downloader cannot monopolise the link.
    # The first N bytes are unthrottled so small assets are unaffected.
    limit_rate_after 2m;
    limit_rate       1m;

    # ── Tighter limits where abuse concentrates ──────────────────────────────
    location /api/ {
        limit_req  zone=req_api burst=50 nodelay;
        limit_conn conn_per_ip 10;
        # proxy_pass http://backend;
    }

    # Authentication endpoints: low rate, and NO nodelay. Queueing is desirable
    # here — it slows credential stuffing without hard-failing a user who
    # mistypes a password twice.
    location = /login {
        limit_req zone=req_auth burst=5;
        # proxy_pass http://backend;
    }

    # ── Reject unused methods early ──────────────────────────────────────────
    # Cheap filter, ahead of any proxying or disk access. Extend the list if
    # your app needs PUT/DELETE.
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # ── Do not become an open proxy ──────────────────────────────────────────
    # Requests arriving with an unknown Host are a scanner signature. Serving
    # them from your default vhost gets you catalogued as a target. A default
    # server that drops the connection removes you from the results.
    #
    # server {
    #     listen 443 ssl default_server;
    #     server_name _;
    #     ssl_reject_handshake on;   # cheapest possible rejection
    #     return 444;
    # }
}


# ═════════════════════════════════════════════════════════════════════════════
# Deriving your own numbers
# ═════════════════════════════════════════════════════════════════════════════
#
# 1. MEASURE YOUR ACTUAL PEAK, per IP, per second:
#
#      awk '{print $1, substr($4, 2)}' /var/log/nginx/access.log \
#        | sort | uniq -c | sort -rn | head -20
#
#    That prints the busiest (IP, second) pairs. Your legitimate p99 sits well
#    below the top entries — the top entries are usually crawlers or your own
#    monitoring.
#
# 2. SET `rate` AT ROUGHLY 2-3x THAT p99. The limiter is there to stop traffic
#    that is orders of magnitude out of band, not to shave the top of normal
#    usage. A limit set too close to real traffic generates support tickets and
#    teaches you to ignore the alerts.
#
# 3. SET `burst` FROM PAGE COMPOSITION. Count the requests a single page load
#    makes (browser devtools, network tab). `burst` should comfortably exceed
#    that, or the first visit of every session gets throttled.
#
# 4. DEPLOY IN OBSERVATION MODE FIRST. Add the zones and the `limit_req_status`
#    but comment out the `limit_req` directives, then grep for what WOULD have
#    been limited. When the only hits are traffic you are happy to reject, turn
#    it on.
#
# 5. RE-MEASURE AFTER TRAFFIC CHANGES. A limit tuned a year ago against a
#    quarter of today's traffic is now a self-inflicted outage waiting for a
#    launch day.
#
# 6. WATCH FOR THE SHARED-IP PROBLEM. Corporate NAT, university networks, mobile
#    carrier CGNAT and VPN exits put thousands of real users behind one address.
#    If you serve any of those populations, per-IP limits need an allowlist or a
#    higher ceiling — check your rejections for a single IP with many distinct
#    User-Agents before assuming it is an attack.
