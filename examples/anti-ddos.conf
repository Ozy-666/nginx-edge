# ─────────────────────────────────────────────────────────────────────────────
# examples/anti-ddos.conf — L7 rate limiting, connection limiting, QUIC
# hardening and timeout tuning for nginx.
#
# THE NUMBERS BELOW ARE PLACEHOLDERS AND ARE DELIBERATELY NOT OUR OPERATING
# VALUES. Copying them verbatim will either throttle your real users or stop
# nothing. See "Deriving your own numbers" at the bottom — do that first.
# ─────────────────────────────────────────────────────────────────────────────
#
# ══ READ THIS BEFORE ANYTHING ELSE ═══════════════════════════════════════════
#
# THIS FILE IS ONE LAYER OF A LAYERED DEFENCE. On its own it is not "DDoS
# protection", and treating it as such is the most common and most expensive
# mistake in this area. nginx only ever sees traffic that has already:
#
#     reached your NIC          ← volumetric floods are already won or lost here
#       └─> passed XDP / eBPF drop rules
#             └─> passed nftables / conntrack
#                   └─> completed a TCP or QUIC handshake
#                         └─> completed a TLS handshake  ← CPU spent already
#                               └─> reached nginx  ← THIS FILE STARTS HERE
#
# What that layering means in practice:
#
#   * A VOLUMETRIC L3/L4 FLOOD saturates your uplink before nginx is consulted
#     at all. No nginx directive can help. That is filtered upstream — XDP,
#     nftables, or your transit provider. If the pipe is full, the pipe is full.
#
#   * A TLS HANDSHAKE FLOOD costs you asymmetric crypto per connection before
#     any `limit_req` is evaluated, because rate limiting happens on REQUESTS
#     and a handshake is not yet a request. Defences live in the TLS config
#     (session resumption — see tls-hardening.conf), in connection limits, and
#     in the layers below nginx.
#
#   * Only once a request exists does anything in this file apply.
#
# Each layer must hold its own ground. Tuning this file harder does not
# compensate for a missing layer below it — it just adds latency for the users
# who are still getting through.
#
# The complementary half of this — filtering before nginx — is intentionally not
# published: a public anti-DDoS ruleset is a public bypass guide.
# ═════════════════════════════════════════════════════════════════════════════


# ═════════════════════════════════════════════════════════════════════════════
# main context
# ═════════════════════════════════════════════════════════════════════════════

# Bound how long a worker may linger after a reload. Under sustained attack,
# reloads happen while thousands of connections are open; without this, old
# workers accumulate and you run out of memory during an incident — a
# self-inflicted outage on top of the attack.
worker_shutdown_timeout 30s;

# Raise the per-worker file-descriptor ceiling. Every connection is at least one
# fd. Hitting the limit produces "too many open files" and refused connections
# that look exactly like a successful attack.
worker_rlimit_nofile 65535;


# ═════════════════════════════════════════════════════════════════════════════
# http{} context — zones must be declared here, not inside server{}
# ═════════════════════════════════════════════════════════════════════════════

# ── Do not advertise your version ────────────────────────────────────────────
# Removes the version from error pages and the Server header. Not a defence in
# itself — but it keeps you out of "sites running version X" scan results,
# which is how opportunistic targeting picks victims.
server_tokens off;

# ── Client identity ──────────────────────────────────────────────────────────
# $binary_remote_addr costs 4 bytes (IPv4) / 16 (IPv6) per entry rather than up
# to 45, so a given zone size holds far more state. 10m ≈ 160k IPv4 entries.
#
# BEHIND A CDN OR PROXY this is the *proxy's* address — every visitor shares one
# bucket and the limit becomes meaningless. Configure real_ip for your
# provider's published ranges, and ONLY those ranges.
#
# set_real_ip_from 10.0.0.0/8;     # your CDN's published ranges ONLY
# real_ip_header   X-Forwarded-For;
# real_ip_recursive on;
#
# IF YOU ARE *NOT* BEHIND A PROXY, defend against forged headers explicitly.
# A client-supplied X-Forwarded-For is attacker-controlled: if anything
# downstream trusts it, an attacker rotates it per request and every rate limit
# keyed on it is bypassed. Neutralise it rather than hoping nothing reads it:
map $http_x_forwarded_for $clean_xff { default ""; }
#   proxy_set_header X-Forwarded-For $clean_xff;

# ── TWO-TIER LIMITING: the technique most guides omit ────────────────────────
# Per-IP limits alone do not stop a botnet. If 10,000 hosts each send 5 r/s,
# every one of them is comfortably under a 10 r/s per-IP limit while your
# origin takes 50,000 r/s. Per-IP limiting is precise but blind to aggregate
# load.
#
# So run BOTH, keyed differently:
#
#   TIER 1 — per-IP ($binary_remote_addr): stops any single abusive client.
#   TIER 2 — per-VHOST ($server_name): a global ceiling on total traffic to
#            this service, regardless of how many distinct sources it comes
#            from. This is what actually catches a distributed flood.
#
# Set tier 2 well ABOVE your real aggregate peak — it is a circuit breaker, not
# a throttle. It should never fire in normal operation. When it does fire, it is
# protecting your upstream from collapsing, and shedding load at the edge with a
# cheap 429 is strictly better than a backend that stops answering everyone.
limit_conn_zone $server_name         zone=conn_vhost:1m;
limit_req_zone  $server_name         zone=req_vhost:1m  rate=1000r/s;   # ceiling

# Tier 1, split by traffic class. One global limit cannot be both generous
# enough for page loads and tight enough for login attempts.
limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;
limit_req_zone  $binary_remote_addr  zone=req_general:10m rate=10r/s;
limit_req_zone  $binary_remote_addr  zone=req_api:10m     rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=req_static:10m  rate=60r/s;
limit_req_zone  $binary_remote_addr  zone=req_auth:10m    rate=15r/m;   # per MINUTE
limit_req_zone  $binary_remote_addr  zone=req_unknown:10m rate=2r/s;    # 404-hunters

# A per-endpoint AGGREGATE cap, separate from the per-IP cap. Protects a single
# expensive backend from saturation by many clients that are each individually
# well-behaved. Same distributed-attack logic as tier 2, scoped to one route.
limit_conn_zone $server_name         zone=api_total:1m;

# ── Status codes and logging ─────────────────────────────────────────────────
# 429 is the correct signal — it tells well-behaved clients and crawlers to back
# off. The default 503 reads as "server broken" and can hurt you in search.
limit_req_status  429;
limit_conn_status 429;

# `warn` keeps rejections visible without drowning the error log. If you graph
# one thing from this file, graph the rate of these lines — a step change is
# your earliest attack signal, usually well before latency moves.
limit_req_log_level  warn;
limit_conn_log_level warn;

# ── Timeouts: the slowloris defence ──────────────────────────────────────────
# Slow attacks open many connections and send bytes just fast enough to stay
# alive, exhausting worker slots with almost no bandwidth. Short timeouts are
# the counter and cost nothing against legitimate traffic.
client_header_timeout 10s;   # time to send the complete request header
client_body_timeout   10s;   # time between body reads
send_timeout          10s;   # time between successful writes to the client
keepalive_timeout     30s;   # idle keepalive; lower = fewer parked sockets
keepalive_requests    500;

# Free the socket immediately on timeout rather than doing a graceful close —
# a graceful close keeps state around, which is what the attacker wants.
reset_timedout_connection on;

# ── Request size and shape caps ──────────────────────────────────────────────
# Bound what one request can make nginx allocate. Raise client_max_body_size
# only on the specific location that accepts uploads, never globally.
client_max_body_size        1m;
client_body_buffer_size     16k;
client_header_buffer_size   1k;
large_client_header_buffers 4 8k;

# Cap the NUMBER of headers, not just their size. Without this, a request with
# thousands of tiny headers passes every size check while forcing large
# allocation and parsing work.
max_headers 50;

# ── Range header hardening ───────────────────────────────────────────────────
# A single request can ask for many byte ranges. Historically this was an
# amplification primitive: a small request forces a large multipart response
# and heavy server-side assembly.
#
#   max_ranges 0;  disables range requests entirely — correct for APIs, DNS
#                  endpoints and small dynamic responses, where nothing
#                  legitimately needs them.
#   max_ranges 1;  allows simple resumable downloads while blocking the
#                  multi-range amplification pattern. Use on media/downloads.
#
# Disabling ranges globally will break video seeking and download resumption,
# so set it per-location according to what that location actually serves.
max_ranges 1;

# ── HTTP/2 and HTTP/3 stream limits ──────────────────────────────────────────
# One connection carries many concurrent streams, so per-connection limits
# matter independently of per-IP connection limits. Without a cap, a single
# connection opens thousands of streams — the shape of the HTTP/2 Rapid Reset
# attack (CVE-2023-44487).
http2_max_concurrent_streams 128;
http3_max_concurrent_streams 128;

# ── QUIC hardening ───────────────────────────────────────────────────────────
# QUIC runs over UDP, which is trivially source-spoofable, and the server's
# first flight is larger than the client's — an amplification reflector if left
# unvalidated.
#
# quic_retry forces address validation: the server answers an unvalidated
# ClientHello with a Retry token and does nothing expensive until the client
# proves it can receive at that address. This is THE essential QUIC anti-DDoS
# directive. It costs one extra round trip on the first connection only, and
# does not affect connection migration (that is CID-based, not address-based).
quic_retry on;

# Persist the key that signs those Retry tokens, so tokens stay valid across a
# reload. Without it, every reload invalidates outstanding tokens and forces
# clients through validation again — a self-inflicted latency spike at the worst
# possible moment. Generate with:  openssl rand 32 > /etc/nginx/quic_key.bin
quic_host_key /etc/nginx/quic_key.bin;

# Bound how many connection IDs a client may hold. Each one is server-side
# state; an unbounded limit lets a client cheaply inflate memory.
quic_active_connection_id_limit 8;

# Generic Segmentation Offload — kernel-side batching of UDP sends. Not a
# security control, but it lowers CPU per packet, which is exactly what you want
# when you are being flooded. Verify your kernel and NIC support it.
quic_gso on;

# ── Reduce per-request syscalls ──────────────────────────────────────────────
# Caching open file descriptors and stat() results cuts syscall load under a
# flood of requests for the same paths. Cheap capacity, not a security control.
open_file_cache          max=10000 inactive=60s;
open_file_cache_valid    60s;
open_file_cache_min_uses 2;
open_file_cache_errors   on;

# ── Allowlists ───────────────────────────────────────────────────────────────
# `geo` builds an efficient radix tree for CIDR matching — use it, not a chain
# of `if`. Typical uses: exempt your own monitoring and management network from
# limits, or gate an admin endpoint.
#
# Never allowlist by User-Agent. It is attacker-controlled, and "verified
# crawler" checks that trust it are trivially bypassed. If you must exempt real
# crawlers, verify by reverse-DNS-then-forward-confirm on the source address.
geo $trusted_client {
    default        0;
    10.0.0.0/8     1;      # your management network
    192.168.0.0/16 1;
}
map $trusted_client $limit_key {
    0 $binary_remote_addr;   # limited normally
    1 "";                    # empty key = exempt from the zone
}
# Then key a zone on $limit_key instead of $binary_remote_addr to apply it.


# ═════════════════════════════════════════════════════════════════════════════
# server{} context
# ═════════════════════════════════════════════════════════════════════════════

server {
    listen 443 ssl;
    listen 443 quic;
    server_name example.com;

    # ── Both tiers applied together ──────────────────────────────────────────
    # `burst` absorbs the natural clustering of real traffic (a page load fires
    # many requests at once). `nodelay` serves the burst immediately instead of
    # queueing it — without it, legitimate page loads feel slow under load.
    limit_req  zone=req_general burst=20   nodelay;   # tier 1: per-IP
    limit_req  zone=req_vhost   burst=2000 nodelay;   # tier 2: global ceiling
    limit_conn conn_per_ip 20;                        # tier 1
    limit_conn conn_vhost  5000;                      # tier 2

    # Cap per-client bandwidth so one downloader cannot monopolise the link.
    # The first N bytes are unthrottled, so small assets are unaffected.
    limit_rate_after 2m;
    limit_rate       1m;

    # ── Method filtering ─────────────────────────────────────────────────────
    # Prefer `limit_except` over `if ($request_method ...)`. It is the documented
    # mechanism, it nests correctly inside location blocks, and it avoids the
    # well-known evaluation surprises of `if` inside location context.
    location / {
        limit_except GET HEAD POST { deny all; }
        limit_req zone=req_general burst=20 nodelay;
    }

    # ── Tighter limits where abuse concentrates ──────────────────────────────
    location /api/ {
        limit_except GET POST { deny all; }
        limit_req  zone=req_api burst=50 nodelay;
        limit_conn conn_per_ip 10;     # per-IP
        limit_conn api_total   200;    # aggregate cap for this endpoint
        max_ranges 0;                  # an API has no use for range requests

        # Buffer the full request before contacting the backend. This is what
        # stops a slow-POST attack at nginx instead of letting it occupy an
        # upstream worker, which is usually a far scarcer resource.
        proxy_request_buffering on;
        proxy_buffering         on;

        # Bound how long a single upstream call may tie up a connection.
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
        # proxy_pass http://backend;
    }

    # Authentication endpoints: low rate, and NO nodelay. Queueing is desirable
    # here — it slows credential stuffing without hard-failing a user who
    # mistypes a password twice.
    location = /login {
        limit_except POST { deny all; }
        limit_req zone=req_auth burst=5;
    }

    # Static assets tolerate a much higher rate — they are cheap to serve and
    # a page load legitimately fetches many at once.
    location /static/ {
        limit_req zone=req_static burst=100 nodelay;
        max_ranges 1;              # allow resumable downloads, block multi-range
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ── Catch-all for paths that do not exist ────────────────────────────────
    # Vulnerability scanners spray hundreds of paths that legitimate users never
    # request. A tight limit on the unmatched route costs real users nothing and
    # makes scanning expensive. This is one of the highest-value, lowest-risk
    # limits available.
    location @notfound {
        limit_req zone=req_unknown burst=5 nodelay;
        return 404;
    }
}

# ── Do not become an open proxy or a scan result ─────────────────────────────
# Requests arriving with an unknown Host are a scanner signature. Serving them
# from your real vhost gets you catalogued as a target.
#
# `ssl_reject_handshake on` is the cheapest possible rejection: nginx aborts
# during the TLS handshake, before any certificate is sent and before any HTTP
# parsing. It is materially cheaper than completing a handshake to return 444.
server {
    listen 443 ssl default_server;
    listen 443 quic default_server;
    server_name _;
    ssl_reject_handshake on;
}


# ═════════════════════════════════════════════════════════════════════════════
# Deriving your own numbers
# ═════════════════════════════════════════════════════════════════════════════
#
# 1. MEASURE YOUR ACTUAL PEAK, per IP, per second:
#
#      awk '{print $1, substr($4, 2)}' /var/log/nginx/access.log \
#        | sort | uniq -c | sort -rn | head -20
#
#    That prints the busiest (IP, second) pairs. Your legitimate p99 sits well
#    below the top entries — those are usually crawlers or your own monitoring.
#
# 2. MEASURE YOUR AGGREGATE PEAK for the tier-2 ceiling:
#
#      awk '{print substr($4, 2)}' /var/log/nginx/access.log \
#        | uniq -c | sort -rn | head -5
#
#    Set the vhost ceiling several times higher than that. It is a circuit
#    breaker: it must not fire during a legitimate traffic spike, only during
#    something categorically abnormal.
#
# 3. SET per-IP `rate` AT ROUGHLY 2-3x YOUR p99. The limiter exists to stop
#    traffic that is orders of magnitude out of band, not to shave the top of
#    normal usage. A limit set too close to real traffic generates support
#    tickets and teaches you to ignore your own alerts.
#
# 4. SET `burst` FROM PAGE COMPOSITION. Count the requests one page load makes
#    (browser devtools, network tab). `burst` must comfortably exceed it, or the
#    first visit of every session gets throttled.
#
# 5. DEPLOY IN OBSERVATION MODE FIRST. Declare the zones but comment out the
#    `limit_req` directives, then grep the error log for what WOULD have been
#    limited. Turn it on when the only hits are traffic you are happy to reject.
#
# 6. RE-MEASURE AFTER TRAFFIC CHANGES. A limit tuned a year ago against a
#    quarter of today's traffic is an outage waiting for a launch day.
#
# 7. WATCH FOR THE SHARED-IP PROBLEM. Corporate NAT, universities, mobile CGNAT
#    and VPN exits put thousands of real users behind one address. Before
#    assuming a noisy IP is an attack, check whether it shows many distinct
#    User-Agents — that is a NAT gateway, not an attacker.
#
#
# ═════════════════════════════════════════════════════════════════════════════
# What this file does NOT protect against
# ═════════════════════════════════════════════════════════════════════════════
#
# Stated plainly, because a false sense of coverage is worse than none:
#
#   * Volumetric L3/L4 floods — decided upstream of nginx. See the layer diagram
#     at the top.
#   * TLS handshake floods — cost is paid before any request exists. Mitigated
#     by session resumption, connection limits, and pre-nginx filtering.
#   * Application logic abuse — a single expensive query within your rate limit
#     will still hurt. That is fixed in the application, with caching and query
#     budgets, not here.
#   * Attacks from a genuinely distributed, low-and-slow botnet that stays under
#     every per-IP threshold. Tier-2 ceilings shed the load, but shedding is not
#     the same as distinguishing attacker from user. At that point you need
#     behavioural analysis or an upstream scrubbing service.
#   * Anything targeting a service other than nginx. Your resolver, SSH, and
#     management plane each need their own posture.
