# ─────────────────────────────────────────────────────────────────────────────
# examples/tls-hardening.conf — TLS 1.3 / HTTP/3 hardening for BoringSSL nginx
#
# THIS IS A TEMPLATE, NOT A DROP-IN. Every path is a placeholder and every
# value is a starting point. Read the comments, then decide for your own site.
#
# Targets nginx 1.31.x built against BoringSSL (see ../README.md). A few
# directives behave differently on BoringSSL than on OpenSSL — those are called
# out inline. Verify with `nginx -V` and `nginx -t` before deploying.
# ─────────────────────────────────────────────────────────────────────────────

server {
    # ── Listeners ────────────────────────────────────────────────────────────
    # HTTP/1.1 + HTTP/2 over TCP.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # HTTP/3 over QUIC (UDP). `reuseport` must appear on exactly ONE server
    # block per address:port — repeating it elsewhere is a config error.
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;

    server_name example.com;

    # ── Certificates ─────────────────────────────────────────────────────────
    # Two chains let modern clients negotiate ECDSA (smaller, faster on Zen 2)
    # while older clients still get RSA. Drop the RSA pair if you do not need it.
    ssl_certificate         /etc/ssl/example.com/ecdsa-fullchain.pem;
    ssl_certificate_key     /etc/ssl/example.com/ecdsa-privkey.pem;
    ssl_certificate         /etc/ssl/example.com/rsa-fullchain.pem;
    ssl_certificate_key     /etc/ssl/example.com/rsa-privkey.pem;

    # ── Protocol versions ────────────────────────────────────────────────────
    # TLS 1.2 is kept only for client compatibility. If your audience allows it,
    # `ssl_protocols TLSv1.3;` alone is strictly better and removes a large
    # amount of legacy negotiation surface.
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── Cipher selection ─────────────────────────────────────────────────────
    # IMPORTANT — BoringSSL difference: `ssl_ciphers` affects TLS 1.2 ONLY.
    # BoringSSL does not expose the TLS 1.3 suite list for configuration, so
    # nginx's `ssl_conf_command Ciphersuites ...` is a no-op here. BoringSSL
    # picks TLS 1.3 suites itself (AES-GCM first where the CPU has AES-NI,
    # ChaCha20-Poly1305 first where it does not). That default is good; there is
    # nothing to tune and no way to tune it.
    #
    # BoringSSL EXTENSION — equal-preference groups, written [A|B]. Suites
    # inside the brackets are treated as equally acceptable, so the CLIENT
    # chooses among them while the server still controls the order of the groups
    # themselves. This is the right way to let an AES-NI client take AES-GCM and
    # a phone without AES hardware take ChaCha20, at the same priority level.
    # The syntax is BoringSSL-only — it is a config error on OpenSSL builds.
    ssl_ciphers '[ECDHE-ECDSA-AES128-GCM-SHA256|ECDHE-ECDSA-CHACHA20-POLY1305]:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305';

    # With TLS 1.3 the client's preference is generally the better signal
    # (it knows whether it has AES hardware). Leave this off unless you have a
    # specific reason.
    ssl_prefer_server_ciphers off;

    # ═════════════════════════════════════════════════════════════════════════
    # Key exchange — including post-quantum
    # ═════════════════════════════════════════════════════════════════════════
    #
    # WHY POST-QUANTUM MATTERS TODAY, even though no quantum computer can break
    # X25519 yet: "harvest now, decrypt later". An adversary who records your
    # encrypted traffic today can archive it indefinitely and decrypt it the day
    # a cryptographically relevant quantum computer exists. The confidentiality
    # of a session is decided at the moment it happens, permanently.
    #
    # This is why KEY EXCHANGE is urgent and SIGNATURES are not. A forged
    # signature must be produced *during* the handshake to matter, so classical
    # certificates can be migrated later, calmly. A recorded key exchange cannot
    # be re-protected after the fact. Hence: PQ key exchange now, PQ certificates
    # (ML-DSA) when the WebPKI ships them.
    #
    # ── Groups this BoringSSL build supports ─────────────────────────────────
    # Read from ssl/ssl_key_share.cc (kNamedGroups) in BoringSSL 0.20260713.0 —
    # this is the complete list. All seven names below are ACCEPTED by
    # `ssl_ecdh_curve`; being accepted does not make one advisable.
    #
    #   X25519MLKEM768         hybrid X25519 + ML-KEM-768   ← use this
    #   MLKEM1024              pure ML-KEM-1024, NO hybrid  ← see warning below
    #   X25519Kyber768Draft00  pre-standard Kyber draft     ← obsolete, skip
    #   X25519                 classical, fast, universal
    #   P-256 / prime256v1     classical
    #   P-384 / secp384r1      classical
    #   P-521 / secp521r1      classical (slow, rarely needed)
    #
    # BoringSSL's own default order is X25519MLKEM768, X25519, P-256, P-384 —
    # note that P-521, MLKEM1024 and the Kyber draft are deliberately excluded
    # from its defaults. That is a good signal about all three.
    #
    # ── Why X25519MLKEM768 specifically ──────────────────────────────────────
    # It is a HYBRID: the session secret is derived from an X25519 exchange AND
    # an ML-KEM-768 encapsulation, combined. An attacker must break BOTH to
    # recover it. That matters because ML-KEM (FIPS 203, standardised 2024) is
    # young by cryptographic standards — hybrids buy post-quantum protection
    # without betting the session on a new primitive holding up. The classical
    # half costs microseconds; there is no reason not to keep it.
    #
    # It is also what actually deploys. Chrome and Firefox both send an
    # X25519MLKEM768 key share by DEFAULT, so real clients negotiate it on the
    # first flight with no extra round trip.
    #
    # ── DO NOT use MLKEM1024 alone on the public internet ────────────────────
    # It parses, it is stronger on paper (ML-KEM-1024 targets a higher security
    # category than -768), and it is the wrong choice anyway: it has NO
    # classical companion. A future cryptanalytic result against lattice schemes
    # would leave those sessions with no fallback whatsoever — exactly the risk
    # hybrids exist to eliminate. Essentially no browser offers it, so in
    # practice you would negotiate nothing and fall back to classical regardless.
    # Higher category ≠ safer here; hybrid vs non-hybrid dominates the choice.
    #
    # ── Do not enable X25519Kyber768Draft00 ──────────────────────────────────
    # The pre-standardisation Kyber draft that Chrome and Cloudflare shipped in
    # 2023-24. ML-KEM changed before finalisation, so it is NOT interoperable
    # with X25519MLKEM768 — it is a separate, dead code path. Every client that
    # spoke it has migrated. Enabling it adds attack surface and negotiates with
    # nobody.
    #
    # ── The real cost is BYTES, not CPU ──────────────────────────────────────
    # A common misconception is that post-quantum means slow. It does not:
    # ML-KEM is lattice arithmetic, which is *cheaper* than elliptic-curve
    # scalar multiplication. On Zen 2 with AVX2 the keygen/encap/decap cost is
    # negligible — this build pays essentially nothing in CPU.
    #
    # The genuine cost is size. ML-KEM-768 public keys are 1184 bytes and
    # ciphertexts 1088 bytes, which pushes the ClientHello past a typical
    # ~1400-byte MTU and splits it across packets. Consequences worth knowing:
    #   * Broken middleboxes that assume a single-packet ClientHello will drop
    #     the connection. This is real and caused rollbacks during the 2024
    #     rollout, though it has largely washed out by now.
    #   * On lossy links, a two-packet first flight is slightly more likely to
    #     need a retransmit.
    # Neither is a reason to skip PQ. Both are reasons to test rather than
    # assume — see ../docs/tls-testing.md.
    #
    # ── Ordering ─────────────────────────────────────────────────────────────
    # Server preference order. Put the hybrid first so any client offering it
    # gets it. Keep classical X25519 next as the fallback for clients that do
    # not — without it they would still work, but via a HelloRetryRequest, which
    # costs an extra round trip.
    #
    # If nginx fails to start with "Unknown curve", your BoringSSL predates
    # ML-KEM. Verify before deploying:
    #     bssl client -curves X25519MLKEM768 -connect example.com:443
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;

    # ── Session resumption ───────────────────────────────────────────────────
    # This is a genuine trade-off, and the usual "tickets off" advice is not
    # automatically right. Both positions are defensible:
    #
    #   tickets OFF — a stolen ticket key retroactively breaks forward secrecy
    #     for every session it covers. The shared cache resumes without that
    #     exposure. Correct if key material at rest is your main worry.
    #
    #   tickets ON  — TLS 1.3 cannot resume at all without them, so "off" means
    #     every returning client pays a full handshake. Under a handshake flood
    #     that is actively WORSE: rejecting a forged ticket costs ~100ns with
    #     AES-NI, while a full handshake costs 50-200us. Turning tickets off can
    #     raise your cost per attack packet by three orders of magnitude.
    #     nginx auto-rotates ticket keys roughly every 24h, which bounds the
    #     forward-secrecy window without any manual key management.
    #
    # Pick deliberately. If you enable tickets across MULTIPLE nodes, they must
    # share `ssl_session_ticket_key` files and you must rotate them yourself.
    ssl_session_tickets on;
    ssl_session_cache   shared:TLS:50m;
    ssl_session_timeout 24h;

    # Smaller TLS records reduce time-to-first-byte and memory per connection.
    # 4k suits small responses (APIs, DoH); leave at the 16k default if you
    # mostly serve large files, where bigger records are more efficient.
    ssl_buffer_size 4k;

    # ── 0-RTT / early data ───────────────────────────────────────────────────
    # Off is the safe default. Early data is REPLAYABLE by a network attacker.
    # Enable it only if everything reachable over it is idempotent.
    ssl_early_data off;
    #
    # If you do enable it, enforce the constraint rather than hoping:
    #   ssl_early_data on;
    #   proxy_set_header Early-Data $ssl_early_data;   # let the origin decide
    # and reject non-idempotent requests outright, per RFC 8470:
    #   location /api/ { if ($ssl_early_data) { return 425; } }
    #
    # (425 Too Early tells the client to retry on the completed handshake.)

    # ── OCSP stapling — NOT AVAILABLE ON BORINGSSL ───────────────────────────
    # Verified on this build: nginx emits
    #     nginx: [warn] "ssl_stapling" ignored, not supported
    # and continues. BoringSSL removed the OCSP APIs nginx's stapling
    # implementation depends on, so the directive parses and does nothing.
    #
    # This is a WARNING, not an error — the config test still passes, which is
    # exactly how people end up believing they have stapling when they do not.
    # If you migrated here from an OpenSSL build, check your `nginx -t` output.
    #
    #   ssl_stapling on;            # no effect on BoringSSL
    #   ssl_stapling_verify on;     # no effect on BoringSSL
    #
    # Practical impact is small: SSL Labs does not require stapling for A+, and
    # most public CAs now issue short-lived certificates where revocation
    # matters less. If stapling is a hard requirement for you, that is a genuine
    # reason to build against OpenSSL instead — see "Why BoringSSL" in the README.
    #
    # `ssl_trusted_certificate` is still useful for verifying upstream/client
    # chains, and `resolver` is still needed for runtime DNS resolution
    # (proxy_pass to a hostname, for instance). Point it at your own resolver.
    ssl_trusted_certificate /etc/ssl/example.com/chain.pem;
    resolver 127.0.0.1:5353 valid=300s;   # your own resolver, not a public one
    resolver_timeout 5s;

    # ── Encrypted Client Hello (ECH) ─────────────────────────────────────────
    # Requires ech-boringssl.patch from this repo — stock nginx implements
    # `ssl_ech_file` against the OpenSSL-ECH API and it is a no-op on BoringSSL.
    # The ECHConfigList in this file must match the HTTPS/SVCB record you
    # publish in DNS, and both must be rotated together.
    # ssl_ech_file /etc/ssl/example.com/ech.key;

    # ── Response headers ─────────────────────────────────────────────────────
    # Advertise HTTP/3 so clients upgrade from TCP on the next request.
    # Keep max-age modest until you are confident in the QUIC path.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # HSTS. Start with a SHORT max-age (e.g. 300) and raise it only once you
    # are certain every subdomain serves HTTPS. `preload` is effectively
    # irreversible on the timescale browsers ship — do not add it casually.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

    # CSP breaks pages when guessed. Deploy it in report-only mode first,
    # collect violations, then enforce. The value below is a starting shape,
    # not a recommendation for your site.
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; frame-ancestors 'self'" always;

    # ── Notes ────────────────────────────────────────────────────────────────
    # * `add_header` does NOT inherit into a location{} that has its own
    #   add_header directives — it replaces the whole set. If you add headers
    #   in a location, repeat the security headers there too. This is the single
    #   most common reason a "hardened" config scores badly: the headers are
    #   present at server level and silently absent on the tested path.
    # * `nginx -T` prints the fully merged config. Trust that, not the file.
}


# ═════════════════════════════════════════════════════════════════════════════
# Scoring A+ on Qualys SSL Labs
# ═════════════════════════════════════════════════════════════════════════════
#
# The grade is simpler than it looks. SSL Labs computes a weighted score from
# four categories, takes the lowest applicable cap, then applies bonuses:
#
#     Certificate       pass/fail (a failure here is a hard cap, not a deduction)
#     Protocol Support  30%
#     Key Exchange      30%
#     Cipher Strength   40%
#
# GETTING TO A — avoid every cap:
#   * Valid, in-date certificate matching the hostname, with the complete
#     intermediate chain served. A missing intermediate is the most common
#     real-world failure; it works in browsers (they cache intermediates) and
#     fails in scanners and non-browser clients.
#   * RSA >= 2048 bits, or ECDSA >= 256 bits.
#   * SHA-256 or better signature. SHA-1 in the chain is an automatic T/F.
#   * TLS 1.2 and 1.3 only. TLS 1.0/1.1 enabled caps you at B.
#   * SSLv2/SSLv3 anywhere is an F.
#   * Forward secrecy on every negotiated suite — ECDHE only, never plain RSA
#     key exchange. The config above satisfies this.
#   * No RC4, no 3DES, no CBC-mode suites in TLS 1.2, no export/NULL/anon.
#   * No DH parameters under 2048 bits. This build has no `ssl_dhparam` at all,
#     which is correct — ECDHE does not use it.
#
# GETTING FROM A TO A+ — exactly one thing:
#   * HSTS with max-age >= 15768000 (six months). That is the whole difference.
#
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
#
#     63072000 is two years, the value the preload list expects.
#
#     BEFORE YOU SHIP THIS, understand what it commits you to:
#       - `includeSubDomains` means EVERY subdomain must serve valid HTTPS.
#         An internal-only http:// host under the same domain becomes
#         unreachable in browsers that have seen the header.
#       - `preload` submits you to a list compiled into browsers. Removal takes
#         months to reach users. It is close to irreversible in practice.
#       - Roll out with a short max-age first (300), confirm nothing breaks,
#         then raise it. Add `preload` last, and only if you mean it.
#
#     A+ does NOT require OCSP stapling, and does not require a CAA record.
#     Both are good practice; neither changes the letter grade.
#
# GOING FURTHER — 100/100 in every category. This costs compatibility, and for
# most public sites it is the wrong trade. Included so the choice is informed:
#   * Protocol Support 100 requires TLS 1.3 ONLY. Keeping TLS 1.2 scores 95 on
#     the worst-protocol half, averaging 97.5. Dropping 1.2 loses older Android,
#     older Java, and various embedded clients.
#   * Cipher Strength 100 requires every negotiable suite to be 256-bit. The
#     AES-128-GCM suites above score 90 — and AES-128-GCM is not meaningfully
#     weaker in any practical sense, it is faster, and clients often prefer it.
#   * Key Exchange 100 requires a >= 4096-bit-equivalent exchange.
#   Chasing 100/100 to impress a scanner while cutting off real users is a bad
#   trade. A+ is the target that means something.
#
# WHAT SSL LABS DOES NOT TEST — relevant to this build specifically:
#   * HTTP/3 and QUIC. The scanner is TCP-only, so your entire h3 path is
#     ungraded. Test it separately (see below).
#   * Encrypted Client Hello. Not covered at all.
#   * Post-quantum key exchange. X25519MLKEM768 is not reflected in the grade.
#   * Security headers beyond HSTS. Nothing about CSP, frame options, etc.
#   A clean A+ therefore says nothing about the majority of what this config
#   actually does. Treat it as a floor, not a verdict.


# Redirect plain HTTP. Keep this minimal — it should do one thing.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}
